[project]
name = "ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sulimusa", email = "myndaiele1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gitsource==0.0.4",
    "jaxn>=0.0.5",
    "jupyter>=1.1.1",
    "langchain>=1.4.6",
    "langchain-openai>=1.7.2",
    "langgraph>=1.2.15",
    "markitdown[pdf]>=0.1.8",
    "minsearch==0.0.9",
    "openai>=3.17.0",
    "pydantic-ai-slim[openai]>=2.56.0",
    "python-frontmatter>=1.3.0",
    "requests>=2.34.2",
    "toyaikit>=0.0.11",
]

[project.scripts]
ai-engineering-buildcamp = "ai_engineering_buildcamp:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv.workspace]
members = [
    "homework/04-testing",
]
