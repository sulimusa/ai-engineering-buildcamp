[project]
name = "ai-engineering-buildcamp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sulimusa", email = "myndaiele1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "gitsource==0.0.4",
    "jaxn>=0.0.5",
    "jupyter>=1.1.1",
    "markitdown[pdf]>=0.1.8",
    "minsearch>=0.2.0",
